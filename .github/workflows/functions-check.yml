name: GreenPulse Functions Check

on:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/functions-check.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/functions-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check index.js
      - name: Run unit tests
        run: node --test test/*.test.js
