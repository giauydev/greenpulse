
name: GreenPulse Functions Quick Check

on:
  push:
    paths:
      - "functions/**"
      - ".github/workflows/functions-check.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Firebase Functions
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: node --check index.js

      - name: Smoke test module loading
        run: node -e "require('./index.js'); console.log('Functions loaded successfully')"
